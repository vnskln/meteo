name: Deploy Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build and verify
        run: ./mvnw verify

  e2e:
    needs: backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: deploy
    env:
      POSTGRES_DB: meteo
      POSTGRES_USER: meteo
      POSTGRES_PASSWORD: mock-password
      ADMIN_USERNAME: mock-user
      ADMIN_PASSWORD: mock-password
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start stack
        run: docker compose -f compose.yaml -f compose.local.yaml up -d --build
      - name: Wait for backend
        run: curl --fail --silent --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/api/health
      - name: Run zai-tests
        run: |
          node ../assignment/zai-tests.mjs --app http://localhost:8080 --user mock-user --pass mock-password --stage E2 | tee report.txt
          # Show the report on the run summary page too
          { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  image:
    needs: backend
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: ghcr.io/vnskln/meteo-backend:${{ github.sha }}

  deploy-staging:
    needs: image
    runs-on: ubuntu-24.04
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.STAGING_HOST }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy compose
        run: scp deploy/compose.yaml deploy/compose.staging.yaml "$TARGET:/opt/zai/staging/"
      - name: Deploy
        run: |
          ssh "$TARGET" "TAG=${{ github.sha }} sh -s" <<'EOF'
            set -e
            cd /opt/zai/staging
            sed -i "s/^TAG=.*/TAG=$TAG/" .env
            docker compose -f compose.yaml -f compose.staging.yaml pull
            docker compose -f compose.yaml -f compose.staging.yaml up -d
            docker image prune -af
          EOF
      - name: Smoke test
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          body=$(curl --fail --silent --show-error --retry 10 --retry-delay 5 "$STAGING_URL/api/health")
          echo "$body"
          echo "$body" | grep -qF '"status":"ok"'
      - name: Copy generator
        run: |
          ssh "$TARGET" mkdir -p /opt/zai/generator-staging
          scp deploy/generator/compose.yaml generator/generator.py "$TARGET:/opt/zai/generator-staging/"
      - name: Deploy generator
        run: |
          ssh "$TARGET" sh -s <<'EOF'
            set -e
            cd /opt/zai/generator-staging
            docker compose up -d --force-recreate
          EOF
