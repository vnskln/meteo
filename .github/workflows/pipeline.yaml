name: Deploy Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build and verify
        run: ./mvnw verify

  e2e:
    needs: backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: deploy
    env:
      POSTGRES_DB: meteo
      POSTGRES_USER: meteo
      POSTGRES_PASSWORD: mock-password
      ADMIN_USERNAME: mock-user
      ADMIN_PASSWORD: mock-password
      COMPOSE_FILE: compose.yaml:compose.local.yaml:compose.e2e.yaml
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for backend
        run: curl --fail --silent --insecure --retry 30 --retry-delay 2 --retry-all-errors https://localhost/api/health
      - name: Trust Caddy local CA
        run: docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/caddy-root.crt"
      - name: Sample data from the generator
        run: |
          set -o pipefail
          token=$(curl --fail --silent --retry 10 --retry-delay 1 --retry-all-errors -X POST http://localhost:8080/api/auth/login -H 'Content-Type: application/json' \
            -d '{"username":"mock-user","password":"mock-password"}' | jq -r .accessToken)
          for city in Warsaw Krakow Gdansk; do
            series=$(curl --fail --silent -X POST http://localhost:8080/api/series -H "Authorization: Bearer $token" \
              -H 'Content-Type: application/json' -d "{\"name\":\"$city\",\"minValue\":-40,\"maxValue\":50,\"color\":\"#1f77b4\"}" | jq .id)
            key=$(curl --fail --silent -X POST http://localhost:8080/api/sensors -H "Authorization: Bearer $token" \
              -H 'Content-Type: application/json' -d "{\"name\":\"$city sensor\",\"seriesId\":$series}" | jq -r .apiKey)
            python3 ../generator/generator.py --api-url http://localhost:8080 --api-key "$key" \
              --mode backfill --source sine --min -5 --max 15 --count 20 --interval 900
          done
      - name: Run zai-tests
        env:
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/caddy-root.crt
        run: |
          node ../assignment/zai-tests.mjs --app https://localhost --user mock-user --pass mock-password --stage E2 | tee report.txt
          # Show the report on the run summary page too
          { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  image:
    needs: backend
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: ghcr.io/vnskln/meteo-backend:${{ github.sha }}

  deploy-staging:
    needs: image
    runs-on: ubuntu-24.04
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.STAGING_HOST }}
      APP_URL: ${{ vars.STAGING_URL }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy compose
        run: scp deploy/compose.yaml deploy/compose.staging.yaml "$TARGET:/opt/zai/staging/"
      - name: Deploy
        run: |
          ssh "$TARGET" "TAG=${{ github.sha }} sh -s" <<'EOF'
            set -e
            cd /opt/zai/staging
            sed -i "s/^TAG=.*/TAG=$TAG/" .env
            docker compose -f compose.yaml -f compose.staging.yaml pull
            docker compose -f compose.yaml -f compose.staging.yaml up -d
            docker image prune -af
          EOF
      - name: Smoke test
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          body=$(curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-all-errors "$STAGING_URL/api/health")
          echo "$body"
          echo "$body" | grep -qF '"status":"ok"'
      - name: Copy generator
        run: |
          ssh "$TARGET" mkdir -p /opt/zai/generator-staging
          scp deploy/generator/compose.yaml generator/generator.py "$TARGET:/opt/zai/generator-staging/"
      - name: Deploy generator
        run: |
          ssh "$TARGET" sh -s <<'EOF'
            set -e
            cd /opt/zai/generator-staging
            docker compose up -d --force-recreate
          EOF
      - name: Run zai-tests
        run: |
          node assignment/zai-tests.mjs --app "$APP_URL" --user "$ADMIN_USERNAME" --pass "$ADMIN_PASSWORD" --stage E2 | tee report.txt
          { echo "### zai-tests on $APP_URL"; echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove leftover test series
        if: always()
        run: |
          set -o pipefail
          token=$(jq -n --arg u "$ADMIN_USERNAME" --arg p "$ADMIN_PASSWORD" '{username: $u, password: $p}' \
            | curl --fail --silent --show-error -X POST "$APP_URL/api/auth/login" -H 'Content-Type: application/json' --data @- \
            | jq -r .accessToken)
          echo "::add-mask::$token"
          for id in $(curl --fail --silent "$APP_URL/api/series" | jq -r '.[] | select(.name | startswith("ZAI-TEST-")) | .id'); do
            echo "Deleting leftover test series $id"
            curl --fail --silent --show-error -X DELETE -H "Authorization: Bearer $token" "$APP_URL/api/series/$id"
          done
          curl --fail --silent -X POST -H "Authorization: Bearer $token" "$APP_URL/api/auth/logout"
          left=$(curl --fail --silent "$APP_URL/api/series" | jq '[.[] | select(.name | startswith("ZAI-TEST-"))] | length')
          echo "Test series left: $left"
          test "$left" -eq 0

  deploy-edge:
    needs: deploy-staging
    runs-on: ubuntu-24.04
    environment: edge
    concurrency:
      group: deploy-edge
      cancel-in-progress: true
    env:
      TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.EDGE_HOST }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Caddyfile
        run: docker run --rm -v "$PWD/deploy/edge:/etc/caddy:ro" caddy:2.11.7-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Configure ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy edge config
        run: scp deploy/edge/Caddyfile deploy/edge/headers.caddy deploy/edge/compose.yaml "$TARGET:/opt/zai/edge/"
      - name: Deploy edge
        run: ssh "$TARGET" 'cd /opt/zai/edge && docker compose up -d --force-recreate'
      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors https://staging.zai-meteo.pl/api/health
          curl --silent --dump-header - --output /dev/null https://staging.zai-meteo.pl/ | grep -i '^content-security-policy:'

  deploy-prod:
    needs: deploy-staging
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: true
    env:
      TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.PROD_HOST }}
      APP_URL: ${{ vars.PROD_URL }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy compose
        run: scp deploy/compose.yaml deploy/compose.prod.yaml "$TARGET:/opt/zai/prod/"
      - name: Deploy
        run: |
          ssh "$TARGET" "TAG=${{ github.sha }} sh -s" <<'EOF'
            set -e
            cd /opt/zai/prod
            sed -i "s/^TAG=.*/TAG=$TAG/" .env
            docker compose -f compose.yaml -f compose.prod.yaml pull
            docker compose -f compose.yaml -f compose.prod.yaml up -d
            docker image prune -af
          EOF
      - name: Smoke test
        run: |
          body=$(curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-all-errors "$APP_URL/api/health")
          echo "$body"
          echo "$body" | grep -qF '"status":"ok"'
      - name: Copy generator
        run: |
          ssh "$TARGET" mkdir -p /opt/zai/generator-prod
          scp deploy/generator/compose.yaml generator/generator.py "$TARGET:/opt/zai/generator-prod/"
      - name: Deploy generator
        run: |
          ssh "$TARGET" sh -s <<'EOF'
            set -e
            cd /opt/zai/generator-prod
            docker compose up -d --force-recreate
          EOF
      - name: Run zai-tests
        run: |
          node assignment/zai-tests.mjs --app "$APP_URL" --user "$ADMIN_USERNAME" --pass "$ADMIN_PASSWORD" --stage E2 | tee report.txt
          { echo "### zai-tests on $APP_URL"; echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove leftover test series
        if: always()
        run: |
          set -o pipefail
          token=$(jq -n --arg u "$ADMIN_USERNAME" --arg p "$ADMIN_PASSWORD" '{username: $u, password: $p}' \
            | curl --fail --silent --show-error -X POST "$APP_URL/api/auth/login" -H 'Content-Type: application/json' --data @- \
            | jq -r .accessToken)
          echo "::add-mask::$token"
          for id in $(curl --fail --silent "$APP_URL/api/series" | jq -r '.[] | select(.name | startswith("ZAI-TEST-")) | .id'); do
            echo "Deleting leftover test series $id"
            curl --fail --silent --show-error -X DELETE -H "Authorization: Bearer $token" "$APP_URL/api/series/$id"
          done
          curl --fail --silent -X POST -H "Authorization: Bearer $token" "$APP_URL/api/auth/logout"
          left=$(curl --fail --silent "$APP_URL/api/series" | jq '[.[] | select(.name | startswith("ZAI-TEST-"))] | length')
          echo "Test series left: $left"
          test "$left" -eq 0
