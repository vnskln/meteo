services:
  db:
    ports:
      - "127.0.0.1:5433:5432"

  backend:
    image: ghcr.io/vnskln/meteo-backend:${TAG:?TAG is not set}
    networks:
      default:
      edge:
        aliases:
          - meteo-prod-backend

  frontend:
    image: ghcr.io/vnskln/meteo-frontend:${TAG:?TAG is not set}
    restart: unless-stopped
    mem_limit: 64m
    networks:
      edge:
        aliases:
          - meteo-prod-frontend

networks:
  edge:
    external: true
