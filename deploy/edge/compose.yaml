services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./headers.caddy:/etc/caddy/headers.caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    mem_limit: 256m

networks:
  edge:
    external: true

volumes:
  caddy-data:
  caddy-config:
